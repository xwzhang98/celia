# The paper run. Paths are relative to the repository root.
tables: data/tables          # written by scripts/prepare_data.py
seed: 0                      # initial weights, training views and masks
split_seed: 0                # train / val / test split of the simulations (keep 0 to match the paper)
view_cycle: 64               # 64 fixed training views per catalog; 0 = new views every epoch
num_workers: 8

# Warmup-stable-decay: 200 warmup updates, constant to 10,000, linear decay to 0 at 18,000.
peak_learning_rate: 2.0e-4
warmup_updates: 200
decay_start: 10000
total_updates: 18000
weight_decay: 0.05
betas: [0.9, 0.95]
grad_clip_norm: 10.0
ema_momentum: 0.996          # rises to 1 along a cosine during the decay

model:
  dim: 256
  heads: 8
  inducing_points: 64
  isab_blocks: 4
  latent_slots: 32
  voxel_resolution: 16
  voxel_channels: 32
  voxel_conv_blocks: 2
  distance_bias_hidden: 16
  activation_checkpointing: true
